<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noveleare — El hogar donde nacen tus historias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0D12;
      --header-bg: #121F1C;
      --border-header: #202E2A;
      --text-main: #FFFFFF;
      --text-muted: #CBD5E1;
      --text-dim: #94A3B8;
      --accent: #3B82F6;
      --accent-light: #93C5FD;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo atmosférico de santuario de lectura en la naturaleza */
    .hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./assets/library-sanctuary.jpg');
      background-size: cover;
      background-position: center 35%;
      filter: blur(2.5px) brightness(0.48) saturate(1.1);
      transform: scale(1.03);
      z-index: 0;
      pointer-events: none;
    }

    /* Velo de contraste cinematográfico */
    .hero-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(10, 13, 18, 0.45) 0%, rgba(10, 13, 18, 0.75) 70%, rgba(10, 13, 18, 0.92) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Cabecera superior compacta y esbelta (#121F1C) */
    header {
      width: 100%;
      padding: 0.55rem 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-header);
      background-color: var(--header-bg);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: #FFF;
      font-weight: 800;
      font-size: 1.22rem;
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
    }

    .brand:hover {
      opacity: 0.92;
    }

    .brand-symbol {
      height: 28px;
      width: 28px;
      object-fit: contain;
      display: block;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    nav a.active {
      color: #FFF;
    }

    nav a:hover {
      color: #FFF;
    }

    .nav-btn-download {
      background: rgba(59, 130, 246, 0.18);
      color: var(--accent-light) !important;
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 0.32rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.82rem !important;
      transition: all 0.2s ease !important;
    }

    .nav-btn-download:hover {
      background: var(--accent);
      color: #FFF !important;
      transform: translateY(-1px);
    }

    /* Layout Split Hero (50/50 Asimétrico estilo CapCut/Camtasia) */
    main {
      flex: 1;
      width: 100%;
      max-width: 1540px;
      margin: 0 auto;
      padding: 3rem 3.5rem;
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 3.5rem;
      align-items: center;
    }

    /* Columna Izquierda: Mensaje Puro H1 y H2 */
    .hero-text-col {
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(2.8rem, 4.2vw, 4.3rem);
      font-weight: 800;
      color: #FFF;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.9), 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    .hero-highlight {
      white-space: nowrap;
      display: inline-block;
      background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 40%, #BAE6FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 18px rgba(186, 230, 253, 0.45));
    }

    .subtitle {
      font-size: clamp(1.15rem, 1.5vw, 1.35rem);
      color: #E2E8F0;
      max-width: 620px;
      line-height: 1.7;
      font-weight: 500;
      text-shadow: 0 3px 20px rgba(0, 0, 0, 0.9), 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    /* Columna Derecha: Showcase Automático en su Propio Espacio Generoso */
    .hero-showcase-col {
      position: relative;
      width: 100%;
      margin-left: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Marco Elegante y Moderno de la Pantalla (sin barras ni botones) */
    .app-screen-frame {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 35px rgba(16, 185, 129, 0.08);
      background: #0E1116;
    }

    /* Escenario de imágenes en formato panorámico 16:9 */
    .showcase-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    /* Capas de imágenes superpuestas con desvanecimiento cruzado suave */
    .showcase-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.015);
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .showcase-slide.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Pie de página integrado sobre el fondo */
    footer {
      width: 100%;
      padding: 1.5rem 3.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: rgba(226, 232, 240, 0.65);
      font-size: 0.82rem;
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.01em;
    }

    @media (max-width: 1080px) {
      main {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding-top: 2rem;
      }
      .hero-text-col {
        text-align: center;
        align-items: center;
        padding-right: 0;
      }
      .hero-showcase-col {
        width: 100%;
        margin-left: 0;
      }
      footer {
        justify-content: center;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 0.55rem 1.25rem;
      }
      main {
        padding: 2rem 1.25rem;
      }
      h1 { font-size: 2.35rem; }
      footer {
        padding: 1.25rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo atmosférico de santuario de lectura en la naturaleza -->
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <!-- Cabecera compacta y esbelta con color sólido (#121F1C) -->
  <header>
    <a href="./index.html" class="brand" title="Noveleare">
      <img src="./assets/noveleare-symbol-transparent.png" alt="Logo Noveleare" class="brand-symbol" />
      <span>Noveleare</span>
    </a>
    <nav>
      <a href="./index.html" class="active">Inicio</a>
      <a href="./download.html" class="nav-btn-download">Descargar</a>
      <a href="./privacy.html">Privacidad</a>
      <a href="./terms.html">Términos</a>
    </nav>
  </header>

  <!-- Layout Split Hero: 50% Mensaje a la Izquierda / Espacio Generoso a la Derecha -->
  <main>
    <!-- Columna Izquierda: Mensaje Limpio (H1 y H2) -->
    <div class="hero-text-col">
      <h1>El hogar donde nacen<br><span class="hero-highlight">tus historias</span></h1>
      <p class="subtitle">Todo lo que necesitas como autor para dar vida a tus textos en un solo lugar, en un entorno que te acompaña en cada palabra.</p>
    </div>

    <!-- Columna Derecha: Showcase Automático en su Propio Espacio -->
    <div class="hero-showcase-col">
      <div class="app-screen-frame">
        <div class="showcase-stage">
          <!-- 1. Hoja de Trabajo Principal (Editor) -->
          <img 
            src="./assets/showcase-editor.png" 
            alt="Hoja de trabajo principal de Noveleare" 
            class="showcase-slide active"
            id="slide-0"
          />

          <!-- 2. Planeación de Trama & Línea Temporal -->
          <img 
            src="./assets/showcase-plot.png" 
            alt="Planeación de trama y línea temporal en Noveleare" 
            class="showcase-slide"
            id="slide-1"
          />

          <!-- 3. Modo Zen Inmersivo -->
          <img 
            src="./assets/showcase-zen.png" 
            alt="Modo Zen inmersivo de escritura" 
            class="showcase-slide"
            id="slide-2"
          />
        </div>
      </div>
    </div>
  </main>

  <!-- Footer ligero integrado sobre el fondo -->
  <footer>
    <span>© 2026 Noveleare · Desarrollado por Oberon2755</span>
  </footer>

  <script>
    const totalSlides = 3;
    let current = 0;

    function advanceSlide() {
      const prev = current;
      current = (current + 1) % totalSlides;

      // Desvanecer slide anterior y activar nuevo suavemente
      const prevSlide = document.getElementById('slide-' + prev);
      const nextSlide = document.getElementById('slide-' + current);

      if (prevSlide) prevSlide.classList.remove('active');
      if (nextSlide) nextSlide.classList.add('active');
    }

    // Ciclo automático con desvanecimiento continuo cada 3.5 segundos
    setInterval(advanceSlide, 3500);
  </script>

</body>
</html>

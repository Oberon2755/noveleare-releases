<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noveleare — El hogar donde nacen tus historias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0D12;
      --header-bg: #121F1C;
      --border-header: #202E2A;
      --text-main: #FFFFFF;
      --text-muted: #CBD5E1;
      --text-dim: #94A3B8;
      --accent: #3B82F6;
      --accent-light: #93C5FD;
      --mint: #B5E5D8;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo atmosférico nítido y reconocible con suave toque cinematográfico */
    .hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./assets/library-sanctuary.jpg');
      background-size: cover;
      background-position: center 35%;
      filter: blur(2.5px) brightness(0.5) saturate(1.1);
      transform: scale(1.03); /* Evita halos blancos en bordes */
      z-index: 0;
      pointer-events: none;
    }

    /* Velo sutil para realzar el texto sin tapar los detalles del santuario */
    .hero-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(10, 13, 18, 0.32) 0%, rgba(10, 13, 18, 0.62) 70%, rgba(10, 13, 18, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Cabecera superior esbelta y compacta (reducida 50% de altura) */
    header {
      width: 100%;
      padding: 0.55rem 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-header);
      background-color: var(--header-bg);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: #FFF;
      font-weight: 800;
      font-size: 1.22rem;
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
    }

    .brand:hover {
      opacity: 0.92;
    }

    .brand-symbol {
      height: 28px;
      width: 28px;
      object-fit: contain;
      display: block;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    nav a.active {
      color: #FFF;
    }

    nav a:hover {
      color: #FFF;
    }

    .nav-btn-download {
      background: rgba(59, 130, 246, 0.18);
      color: var(--accent-light) !important;
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 0.32rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.82rem !important;
      transition: all 0.2s ease !important;
    }

    .nav-btn-download:hover {
      background: var(--accent);
      color: #FFF !important;
      transform: translateY(-1px);
    }

    /* Área central de escritorio: Protagonismo puro para H1 y H2 */
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2.5rem;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-content {
      text-align: center;
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(3.2rem, 5.5vw, 4.75rem);
      font-weight: 800;
      color: #FFF;
      letter-spacing: -0.04em;
      line-height: 1.14;
      margin-bottom: 1.75rem;
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.8), 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    h1 span {
      background: linear-gradient(135deg, #B5E5D8 15%, #93C5FD 60%, #3B82F6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(59, 130, 246, 0.3));
    }

    .subtitle {
      font-size: clamp(1.22rem, 2vw, 1.48rem);
      color: #F1F5F9;
      max-width: 840px;
      margin: 0 auto;
      line-height: 1.7;
      font-weight: 500;
      text-shadow: 0 3px 20px rgba(0, 0, 0, 0.85), 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    /* Pie de página integrado directamente sobre el fondo (sin franja sólida) */
    footer {
      width: 100%;
      padding: 1.5rem 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(226, 232, 240, 0.65);
      font-size: 0.84rem;
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.01em;
    }

    @media (max-width: 768px) {
      header {
        padding: 0.55rem 1.25rem;
      }
      main {
        padding: 3rem 1.25rem;
      }
      footer {
        padding: 1.5rem 1.25rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo atmosférico nítido del santuario de lectura en la naturaleza -->
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <!-- Cabecera compacta y esbelta con color sólido (#121F1C) -->
  <header>
    <a href="./index.html" class="brand" title="Noveleare">
      <img src="./assets/noveleare-symbol-transparent.png" alt="Logo Noveleare" class="brand-symbol" />
      <span>Noveleare</span>
    </a>
    <nav>
      <a href="./index.html" class="active">Inicio</a>
      <a href="./download.html" class="nav-btn-download">Descargar</a>
      <a href="./privacy.html">Privacidad</a>
      <a href="./terms.html">Términos</a>
    </nav>
  </header>

  <!-- Contenido central: H1 y H2 con máximo protagonismo y claridad -->
  <main>
    <div class="hero-content">
      <h1>El hogar donde nacen <span>tus historias</span></h1>
      <p class="subtitle">Todo lo que necesitas como autor para dar vida a tus textos en un solo lugar, en un entorno que te acompaña en cada palabra.</p>
    </div>
  </main>

  <!-- Footer ligero integrado sobre el fondo (sin barra sólida ni botones) -->
  <footer>
    <span>© 2026 Noveleare · Desarrollado por Oberon2755</span>
  </footer>

</body>
</html>
